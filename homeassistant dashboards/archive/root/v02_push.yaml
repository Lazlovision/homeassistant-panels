path: office-panel
theme: default
title: Office Panel
views:
- badges: []
  cards:
  - card_mod:
      style: ":host {\n  --bg-color: #050507;\n  --text-primary: #FFFFFF;\n  --text-muted:\
        \ #8A8A93;\n  --card-bg: rgba(25, 25, 30, 0.4);\n  --primary-cool: #00E5FF;\n\
        \  --primary-heat: #FF3366;\n}\nha-card {\n  background: transparent !important;\n\
        \  border: none !important;\n  box-shadow: none !important;\n  padding: 0\
        \ !important;\n}\n"
    cards:
    - type: custom:button-card
      entity: weather.forecast_home
      show_name: false
      show_icon: false
      show_state: false
      custom_fields:
        content: "[[[\n  var w = states['weather.forecast_home'];\n  var out = states['sensor.air_conditioner_office_outside_air_temp'];\n\
          \  var icon = {clear_night:'\u2600\uFE0F',sunny:'\u2600\uFE0F',cloudy:'\u26C5\
          ',partlycloudy:'\u26C5',rainy:'\U0001F327\uFE0F',snowy:'\u2744\uFE0F',windy:'\U0001F390\
          '}[w?.state] || '\u26C5';\n  var outT = out ? parseFloat(out.state) + '\xB0\
          C' : '--\xB0C';\n  return '<div style=\"display:flex;justify-content:space-between;align-items:center;padding:4px\
          \ 8px;\">' +\n    '<span style=\"color:var(--text-primary);font-size:24px;font-weight:600;letter-spacing:-0.5px;\"\
          >Office</span>' +\n    '<div style=\"display:flex;align-items:center;gap:12px;color:var(--text-muted);font-size:14px;background:var(--card-bg);padding:8px\
          \ 16px;border-radius:24px;\">' +\n    '<span>' + icon + '</span><span style=\"\
          font-weight:500;color:var(--text-primary);\">' + outT + ' Outside</span></div></div>';\n\
          ]]]\n"
      styles:
        card:
        - background: transparent
        - border: none
        - box-shadow: none
        - padding: '0'
        custom_fields:
          content:
          - width: 100%
    - cards:
      - entity: scene.office_daytime
        icon: mdi:home-variant-outline
        name: ARRIVE
        styles:
          card:
          - background: var(--card-bg)
          - backdrop-filter: blur(24px)
          - border-radius: 16px
          - height: 80px
          - border: 1px solid rgba(255,255,255,0.05)
          icon:
          - color: '#00E5FF'
          - width: 28px
          name:
          - color: var(--text-primary)
          - font-size: 11px
          - font-weight: '600'
          - letter-spacing: 1px
        tap_action:
          action: call-service
          data:
            entity_id: scene.office_daytime
          service: scene.turn_on
        type: custom:button-card
      - entity: scene.office_movie
        icon: mdi:filmstrip
        name: MOVIE
        styles:
          card:
          - background: var(--card-bg)
          - backdrop-filter: blur(24px)
          - border-radius: 16px
          - height: 80px
          - border: 1px solid rgba(255,255,255,0.05)
          icon:
          - color: '#FF9F0A'
          - width: 28px
          name:
          - color: var(--text-primary)
          - font-size: 11px
          - font-weight: '600'
          - letter-spacing: 1px
        tap_action:
          action: call-service
          data:
            entity_id: scene.office_movie
          service: scene.turn_on
        type: custom:button-card
      - entity: scene.office_leave
        icon: mdi:door-open
        name: LEAVE
        styles:
          card:
          - background: var(--card-bg)
          - backdrop-filter: blur(24px)
          - border-radius: 16px
          - height: 80px
          - border: 1px solid rgba(255,255,255,0.05)
          icon:
          - color: '#FF3366'
          - width: 28px
          name:
          - color: var(--text-primary)
          - font-size: 11px
          - font-weight: '600'
          - letter-spacing: 1px
        tap_action:
          action: call-service
          data:
            entity_id: scene.office_leave
          service: scene.turn_on
        type: custom:button-card
      - entity: scene.office_sleep
        icon: mdi:moon-waning-crescent
        name: SLEEP
        styles:
          card:
          - background: var(--card-bg)
          - backdrop-filter: blur(24px)
          - border-radius: 16px
          - height: 80px
          - border: 1px solid rgba(255,255,255,0.05)
          icon:
          - color: '#30D158'
          - width: 28px
          name:
          - color: var(--text-primary)
          - font-size: 11px
          - font-weight: '600'
          - letter-spacing: 1px
        tap_action:
          action: call-service
          data:
            entity_id: scene.office_sleep
          service: scene.turn_on
        type: custom:button-card
      type: horizontal-stack
    - cards:
      - card_mod:
          style: ':host { flex: 1.3 !important; }

            #root { display: flex !important; flex-direction: column !important; gap:
            12px !important; }

            '
        cards:
        - type: custom:button-card
          entity: light.office_main_lights
          show_name: false
          show_icon: false
          custom_fields:
            card_content: "[[[\n  var s = states['light.office_main_lights'];\n  var\
              \ on = s && s.state === 'on';\n  var pct = on ? Math.round((s.attributes.brightness\
              \ || 255) / 255 * 100) : 0;\n  return '<div style=\"display:flex;flex-direction:column;padding:16px\
              \ 20px;\">' +\n    '<div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;\"\
              >' +\n      '<div style=\"display:flex;align-items:center;\">' +\n \
              \       '<ha-icon icon=\"mdi:lightbulb\" style=\"color:' + (on ? 'var(--primary-cool)'\
              \ : 'var(--text-muted)') + ';--mdc-icon-size:22px;margin-right:12px;\"\
              ></ha-icon>' +\n        '<div>' +\n          '<p style=\"margin:0;color:var(--text-primary);font-size:14px;font-weight:600;\"\
              >Main Lights</p>' +\n          '<p style=\"margin:2px 0 0;color:var(--text-muted);font-size:12px;\"\
              >' + (on ? pct + '%' : 'OFF') + '</p>' +\n        '</div>' +\n     \
              \ '</div>' +\n      '<div style=\"width:44px;height:24px;border-radius:12px;background:'\
              \ +\n        (on ? 'rgba(0,229,255,0.3)' : 'rgba(255,255,255,0.1)')\
              \ + ';' +\n        'display:flex;align-items:center;padding:' +\n  \
              \      (on ? '2px 2px 2px 20px' : '2px 20px 2px 2px') + ';transition:all\
              \ 0.3s;\">' +\n        '<div style=\"width:20px;height:20px;border-radius:50%;background:'\
              \ +\n        (on ? 'var(--primary-cool)' : '#8A8A93') + ';\"></div></div></div>'\
              \ +\n    '<div style=\"position:relative;width:100%;height:6px;background:rgba(255,255,255,0.08);border-radius:3px;\"\
              >' +\n      '<div style=\"position:absolute;top:0;left:0;width:' + pct\
              \ + '%;height:100%;background:var(--primary-cool);border-radius:3px;\"\
              ></div>' +\n    '</div></div>';\n]]]\n"
          styles:
            card:
            - background: var(--card-bg)
            - backdrop-filter: blur(24px)
            - border-radius: 20px
            - border: 1px solid rgba(255,255,255,0.05)
          tap_action:
            action: call-service
            data:
              entity_id: light.office_main_lights
            service: light.toggle
        - type: custom:button-card
          entity: light.office_main_lights
          show_name: false
          show_icon: false
          custom_fields:
            card_content: "[[[\n  var s = states['light.office_main_lights'];\n  var\
              \ on = s && s.state === 'on';\n  var pct = on ? Math.round((s.attributes.brightness\
              \ || 255) / 255 * 100) : 0;\n  return '<div style=\"display:flex;flex-direction:column;padding:16px\
              \ 20px;\">' +\n    '<div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;\"\
              >' +\n      '<div style=\"display:flex;align-items:center;\">' +\n \
              \       '<ha-icon icon=\"mdi:desk-lamp\" style=\"color:' + (on ? '#FF9F0A'\
              \ : 'var(--text-muted)') + ';--mdc-icon-size:22px;margin-right:12px;\"\
              ></ha-icon>' +\n        '<div>' +\n          '<p style=\"margin:0;color:var(--text-primary);font-size:14px;font-weight:600;\"\
              >Task Light</p>' +\n          '<p style=\"margin:2px 0 0;color:var(--text-muted);font-size:12px;\"\
              >' + (on ? pct + '%' : 'OFF') + '</p>' +\n        '</div>' +\n     \
              \ '</div>' +\n      '<div style=\"width:44px;height:24px;border-radius:12px;background:'\
              \ +\n        (on ? 'rgba(255,159,10,0.3)' : 'rgba(255,255,255,0.1)')\
              \ + ';' +\n        'display:flex;align-items:center;padding:' +\n  \
              \      (on ? '2px 2px 2px 20px' : '2px 20px 2px 2px') + ';transition:all\
              \ 0.3s;\">' +\n        '<div style=\"width:20px;height:20px;border-radius:50%;background:'\
              \ +\n        (on ? '#FF9F0A' : '#8A8A93') + ';\"></div></div></div>'\
              \ +\n    '<div style=\"position:relative;width:100%;height:6px;background:rgba(255,255,255,0.08);border-radius:3px;\"\
              >' +\n      '<div style=\"position:absolute;top:0;left:0;width:' + pct\
              \ + '%;height:100%;background:#FF9F0A;border-radius:3px;\"></div>' +\n\
              \    '</div></div>';\n]]]\n"
          styles:
            card:
            - background: var(--card-bg)
            - backdrop-filter: blur(24px)
            - border-radius: 20px
            - border: 1px solid rgba(255,255,255,0.05)
          tap_action:
            action: call-service
            data:
              entity_id: light.office_main_lights
            service: light.toggle
        type: vertical-stack
      - card_mod:
          style: ':host { flex: 0.9 !important; }

            #root { display: flex !important; flex-direction: column !important; gap:
            12px !important; }

            '
        cards:
        - card_mod:
            style: "ha-card {\n  background: var(--card-bg) !important;\n  backdrop-filter:\
              \ blur(24px);\n  border: 1px solid rgba(255,255,255,0.05) !important;\n\
              \  border-radius: 24px !important;\n  padding: 20px 16px !important;\n\
              \  --state-climate-cool-color: var(--primary-cool);\n  --state-climate-heat-color:\
              \ var(--primary-heat);\n  --state-climate-dry-color: #FF9F0A;\n  --state-climate-fan_only-color:\
              \ #30D158;\n  --ha-card-header-color: var(--text-muted);\n  --primary-text-color:\
              \ var(--text-primary);\n  --secondary-text-color: var(--text-muted);\n\
              }\n"
          entity: climate.air_conditioner_office_climate
          name: THERMOSTAT
          type: thermostat
        - type: custom:button-card
          entity: climate.air_conditioner_office_climate
          name: SYSTEM MODE
          custom_fields:
            auto:
              card:
                type: custom:button-card
                name: AUTO
                tap_action:
                  action: call-service
                  service: climate.set_hvac_mode
                  data:
                    entity_id: climate.air_conditioner_office_climate
                    hvac_mode: auto
                styles:
                  card:
                  - background: '[[[ return states[''climate.air_conditioner_office_climate''].state
                      === ''auto'' ? ''#FFFFFF'' : ''rgba(255,255,255,0.05)'' ]]]'
                  - border-radius: 8px
                  - height: 38px
                  name:
                  - color: '[[[ return states[''climate.air_conditioner_office_climate''].state
                      === ''auto'' ? ''#050507'' : ''#FFFFFF'' ]]]'
                  - font-size: 11px
                  - font-weight: '700'
            cool:
              card:
                type: custom:button-card
                name: COOL
                tap_action:
                  action: call-service
                  service: climate.set_hvac_mode
                  data:
                    entity_id: climate.air_conditioner_office_climate
                    hvac_mode: cool
                styles:
                  card:
                  - background: '[[[ return states[''climate.air_conditioner_office_climate''].state
                      === ''cool'' ? ''#00E5FF'' : ''rgba(255,255,255,0.05)'' ]]]'
                  - border-radius: 8px
                  - height: 38px
                  name:
                  - color: '[[[ return states[''climate.air_conditioner_office_climate''].state
                      === ''cool'' ? ''#050507'' : ''#FFFFFF'' ]]]'
                  - font-size: 11px
                  - font-weight: '700'
            dry:
              card:
                type: custom:button-card
                name: DRY
                tap_action:
                  action: call-service
                  service: climate.set_hvac_mode
                  data:
                    entity_id: climate.air_conditioner_office_climate
                    hvac_mode: dry
                styles:
                  card:
                  - background: '[[[ return states[''climate.air_conditioner_office_climate''].state
                      === ''dry'' ? ''#FF9F0A'' : ''rgba(255,255,255,0.05)'' ]]]'
                  - border-radius: 8px
                  - height: 38px
                  name:
                  - color: '[[[ return states[''climate.air_conditioner_office_climate''].state
                      === ''dry'' ? ''#050507'' : ''#FFFFFF'' ]]]'
                  - font-size: 11px
                  - font-weight: '700'
            fan:
              card:
                type: custom:button-card
                name: FAN
                tap_action:
                  action: call-service
                  service: climate.set_hvac_mode
                  data:
                    entity_id: climate.air_conditioner_office_climate
                    hvac_mode: fan_only
                styles:
                  card:
                  - background: '[[[ return states[''climate.air_conditioner_office_climate''].state
                      === ''fan_only'' ? ''#30D158'' : ''rgba(255,255,255,0.05)''
                      ]]]'
                  - border-radius: 8px
                  - height: 38px
                  name:
                  - color: '[[[ return states[''climate.air_conditioner_office_climate''].state
                      === ''fan_only'' ? ''#050507'' : ''#FFFFFF'' ]]]'
                  - font-size: 11px
                  - font-weight: '700'
            heat:
              card:
                type: custom:button-card
                name: HEAT
                tap_action:
                  action: call-service
                  service: climate.set_hvac_mode
                  data:
                    entity_id: climate.air_conditioner_office_climate
                    hvac_mode: heat
                styles:
                  card:
                  - background: '[[[ return states[''climate.air_conditioner_office_climate''].state
                      === ''heat'' ? ''#FF3366'' : ''rgba(255,255,255,0.05)'' ]]]'
                  - border-radius: 8px
                  - height: 38px
                  name:
                  - color: '[[[ return states[''climate.air_conditioner_office_climate''].state
                      === ''heat'' ? ''#050507'' : ''#FFFFFF'' ]]]'
                  - font-size: 11px
                  - font-weight: '700'
            'off':
              card:
                type: custom:button-card
                name: 'OFF'
                tap_action:
                  action: call-service
                  service: climate.set_hvac_mode
                  data:
                    entity_id: climate.air_conditioner_office_climate
                    hvac_mode: 'off'
                styles:
                  card:
                  - background: '[[[ return states[''climate.air_conditioner_office_climate''].state
                      === ''off'' ? ''#8A8A93'' : ''rgba(255,255,255,0.05)'' ]]]'
                  - border-radius: 8px
                  - height: 38px
                  name:
                  - color: '[[[ return states[''climate.air_conditioner_office_climate''].state
                      === ''off'' ? ''#050507'' : ''#FFFFFF'' ]]]'
                  - font-size: 11px
                  - font-weight: '700'
          styles:
            card:
            - background: rgba(25, 25, 30, 0.4)
            - backdrop-filter: blur(24px)
            - border: 1px solid rgba(255,255,255,0.05)
            - border-radius: 16px
            - padding: 14px
            grid:
            - grid-template-areas: '"n n" "cool heat" "auto dry" "fan off"'
            - grid-template-columns: 1fr 1fr
            - grid-gap: 6px
            name:
            - color: '#8A8A93'
            - font-size: 10px
            - font-weight: '700'
            - letter-spacing: 1px
            - padding-bottom: 10px
        - type: custom:button-card
          entity: climate.air_conditioner_office_climate
          name: FAN SPEED
          custom_fields:
            auto:
              card:
                type: custom:button-card
                name: AUTO
                tap_action:
                  action: call-service
                  service: climate.set_fan_mode
                  data:
                    entity_id: climate.air_conditioner_office_climate
                    fan_mode: auto
                styles:
                  card:
                  - background: '[[[ return states[''climate.air_conditioner_office_climate''].attributes.fan_mode
                      === ''auto'' ? ''#FFFFFF'' : ''rgba(255,255,255,0.05)'' ]]]'
                  - border-radius: 8px
                  - height: 38px
                  name:
                  - color: '[[[ return states[''climate.air_conditioner_office_climate''].attributes.fan_mode
                      === ''auto'' ? ''#050507'' : ''#FFFFFF'' ]]]'
                  - font-size: 11px
                  - font-weight: '700'
            low:
              card:
                type: custom:button-card
                name: LOW
                tap_action:
                  action: call-service
                  service: climate.set_fan_mode
                  data:
                    entity_id: climate.air_conditioner_office_climate
                    fan_mode: low
                styles:
                  card:
                  - background: '[[[ return states[''climate.air_conditioner_office_climate''].attributes.fan_mode
                      === ''low'' ? ''#FFFFFF'' : ''rgba(255,255,255,0.05)'' ]]]'
                  - border-radius: 8px
                  - height: 38px
                  name:
                  - color: '[[[ return states[''climate.air_conditioner_office_climate''].attributes.fan_mode
                      === ''low'' ? ''#050507'' : ''#FFFFFF'' ]]]'
                  - font-size: 11px
                  - font-weight: '700'
            medium:
              card:
                type: custom:button-card
                name: MED
                tap_action:
                  action: call-service
                  service: climate.set_fan_mode
                  data:
                    entity_id: climate.air_conditioner_office_climate
                    fan_mode: medium
                styles:
                  card:
                  - background: '[[[ return states[''climate.air_conditioner_office_climate''].attributes.fan_mode
                      === ''medium'' ? ''#FFFFFF'' : ''rgba(255,255,255,0.05)'' ]]]'
                  - border-radius: 8px
                  - height: 38px
                  name:
                  - color: '[[[ return states[''climate.air_conditioner_office_climate''].attributes.fan_mode
                      === ''medium'' ? ''#050507'' : ''#FFFFFF'' ]]]'
                  - font-size: 11px
                  - font-weight: '700'
            high:
              card:
                type: custom:button-card
                name: HIGH
                tap_action:
                  action: call-service
                  service: climate.set_fan_mode
                  data:
                    entity_id: climate.air_conditioner_office_climate
                    fan_mode: high
                styles:
                  card:
                  - background: '[[[ return states[''climate.air_conditioner_office_climate''].attributes.fan_mode
                      === ''high'' ? ''#FFFFFF'' : ''rgba(255,255,255,0.05)'' ]]]'
                  - border-radius: 8px
                  - height: 38px
                  name:
                  - color: '[[[ return states[''climate.air_conditioner_office_climate''].attributes.fan_mode
                      === ''high'' ? ''#050507'' : ''#FFFFFF'' ]]]'
                  - font-size: 11px
                  - font-weight: '700'
          styles:
            card:
            - background: rgba(25, 25, 30, 0.4)
            - backdrop-filter: blur(24px)
            - border: 1px solid rgba(255,255,255,0.05)
            - border-radius: 16px
            - padding: 14px
            grid:
            - grid-template-areas: '"n n" "auto low" "medium high"'
            - grid-template-columns: 1fr 1fr
            - grid-gap: 6px
            name:
            - color: '#8A8A93'
            - font-size: 10px
            - font-weight: '700'
            - letter-spacing: 1px
            - padding-bottom: 10px
        type: vertical-stack
      type: horizontal-stack
    - type: custom:button-card
      show_icon: false
      show_name: false
      show_state: false
      styles:
        card:
        - background: transparent
        - border: none
        - box-shadow: none
        - height: '0'
  path: office
  title: Office
  type: panel

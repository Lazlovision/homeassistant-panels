kiosk_mode:
  kiosk: true
  admin_settings:
    kiosk: false
path: office-panel
title: Office Panel
views:
- title: Office
  path: office-panel
  type: panel
  badges: []
  cards:
  # ROOT — horizontal-stack with flex column (bedroom pattern, proven)
  - type: horizontal-stack
    card_mod:
      style: |
        :host {
          --bg-color: #000;
          --text-primary: #E4E1E6;
          --text-muted: #A1A1A6;
          --card-bg: rgba(255,255,255,0.05);
          --card-border: rgba(255,255,255,0.08);
          --primary: #64D3FF;
          --primary-dim: rgba(100,211,255,0.15);
          --tertiary: #FFB86F;
          --secondary: #8ADB52;
          --error: #FF4D4D;
          --track-bg: #353438;
        }
        #root {
          background: var(--bg-color) !important;
          width: 100%;
          height: 100vh;
          display: flex !important;
          flex-direction: column !important;
          padding: 16px 24px !important;
          box-sizing: border-box;
          overflow: hidden;
          font-family: 'Outfit', sans-serif;
          gap: 10px !important;
        }
    cards:
    # ── TOP BAR ──
    - type: custom:button-card
      entity: weather.forecast_home
      show_name: false
      show_icon: false
      tap_action: { action: more-info }
      styles:
        card:
        - background: transparent
        - border: none
        - box-shadow: none
        - padding: '0'
      custom_fields:
        bar: |
          [[[
            const w = states['weather.forecast_home'];
            const out = states['sensor.air_conditioner_office_outside_air_temp'];
            const temp = out ? parseFloat(out.state).toFixed(0) : '--';
            const icons = {
              sunny:'☀️','clear-night':'🌙',cloudy:'☁️',
              partlycloudy:'⛅',rainy:'🌧',snowy:'❄️',
              windy:'💨',fog:'🌫'
            };
            return `<div style="display:flex;justify-content:space-between;align-items:center;width:100%;">
              <h1 style="font-size:24px;font-weight:500;color:var(--text-primary);margin:0;">Office</h1>
              <div style="display:flex;align-items:center;gap:8px;padding:6px 14px;border-radius:99px;background:var(--card-bg);border:1px solid var(--card-border);">
                <span style="font-size:18px;">${icons[w?.state]||'🌡'}</span>
                <span style="color:var(--text-primary);font-size:15px;font-weight:600;">${temp}°C</span>
              </div>
            </div>`;
          ]]]

    # ── SCENES ROW ──
    - type: horizontal-stack
      cards:
      - type: custom:button-card
        show_icon: true
        show_name: true
        icon: mdi:sun
        name: Daytime
        tap_action:
          action: call-service
          service: scene.turn_on
          data: { entity_id: scene.office_daytime }
        styles:
          card:
          - background: var(--card-bg)
          - border-radius: 12px
          - height: 84px
          - display: flex !important
          - align-items: center
          - justify-content: center
          icon:
          - color: var(--primary)
          - width: 28px
          name:
          - color: var(--text-primary)
          - font-size: 11px
          - font-weight: 600
          - margin-top: 4px
      - type: custom:button-card
        show_icon: true
        show_name: true
        icon: mdi:movie-open
        name: Movie
        tap_action:
          action: call-service
          service: scene.turn_on
          data: { entity_id: scene.office_movie }
        styles:
          card:
          - background: var(--card-bg)
          - border-radius: 12px
          - height: 84px
          - display: flex !important
          - align-items: center
          - justify-content: center
          icon:
          - color: var(--tertiary)
          - width: 28px
          name:
          - color: var(--text-primary)
          - font-size: 11px
          - font-weight: 600
          - margin-top: 4px
      - type: custom:button-card
        show_icon: true
        show_name: true
        icon: mdi:exit-run
        name: Leave
        tap_action:
          action: call-service
          service: scene.turn_on
          data: { entity_id: scene.office_leave }
        styles:
          card:
          - background: var(--card-bg)
          - border-radius: 12px
          - height: 84px
          - display: flex !important
          - align-items: center
          - justify-content: center
          icon:
          - color: var(--error)
          - width: 28px
          name:
          - color: var(--text-primary)
          - font-size: 11px
          - font-weight: 600
          - margin-top: 4px
      - type: custom:button-card
        show_icon: true
        show_name: true
        icon: mdi:moon-waning-crescent
        name: Sleep
        tap_action:
          action: call-service
          service: scene.turn_on
          data: { entity_id: scene.office_sleep }
        styles:
          card:
          - background: var(--card-bg)
          - border-radius: 12px
          - height: 84px
          - display: flex !important
          - align-items: center
          - justify-content: center
          icon:
          - color: var(--secondary)
          - width: 28px
          name:
          - color: var(--text-primary)
          - font-size: 11px
          - font-weight: 600
          - margin-top: 4px

    # ── CONTENT ROW — fills remaining height ──
    - type: horizontal-stack
      card_mod:
        style: |
          :host { flex-grow: 1 !important; min-height: 0 !important; }
          ha-card { min-height: 0 !important; }
          #root {
            display: flex !important;
            flex-direction: row !important;
            gap: 12px !important;
            min-height: 0 !important;
            height: auto !important;
          }
      cards:
      # LEFT: Lights section
      - type: vertical-stack
        card_mod:
          style: |
            :host { flex: 2 !important; min-width: 0 !important; }
            #root { gap: 8px !important; }
        cards:
        - type: markdown
          content: "LIGHTS"
          card_mod:
            style: |
              ha-card { display:none !important; }
              $: |
                .markdown-text { color: var(--text-muted) !important; font-size: 11px !important; font-weight: 700 !important; letter-spacing: 0.15em !important; padding: 0 4px 0 0 !important; }
        - type: custom:button-card
          entity: light.office_main_lights
          show_name: false
          show_icon: false
          tap_action: { action: toggle }
          hold_action: { action: more-info }
          styles:
            card:
            - background: var(--card-bg)
            - border: 1px solid var(--card-border)
            - border_radius: 12px
            - padding: 16px
            grid:
            - grid-template-areas: '"header" "track"'
            - grid-template-columns: 1fr
          custom_fields:
            header: |
              [[[
                const s = states['light.office_main_lights'];
                const on = s?.state === 'on';
                const brightness = on ? Math.round((s.attributes.brightness||255)/255*100) : 0;
                const c = on ? 'var(--primary)' : 'rgba(255,255,255,0.25)';
                return `<div style="display:flex;justify-content:space-between;align-items:center;">
                  <div style="display:flex;align-items:center;gap:10px;">
                    <ha-icon icon="mdi:lightbulb" style="color:${c};--mdc-icon-size:22px;"></ha-icon>
                    <span style="color:var(--text-primary);font-size:15px;font-weight:500;">Main Lights</span>
                  </div>
                  <div style="display:flex;align-items:center;gap:8px;">
                    <span style="color:${on?'var(--text-primary)':'var(--text-muted)'};font-size:13px;">${on?brightness+'%':'OFF'}</span>
                    <div style="width:38px;height:20px;border-radius:10px;background:${on?'var(--primary-dim)':'var(--track-bg)'};border:1px solid ${on?'var(--primary)':'var(--card-border)'};display:flex;align-items:center;padding:2px;cursor:pointer;">
                      <div style="width:14px;height:14px;border-radius:50%;background:${on?'var(--primary)':'rgba(255,255,255,0.35)'};margin-left:${on?'18px':'0'};"></div>
                    </div>
                  </div>
                </div>`;
              ]]]
            track: |
              [[[
                const s = states['light.office_main_lights'];
                const on = s?.state === 'on';
                const pct = on ? Math.round((s.attributes.brightness||255)/255*100) : 0;
                return `<div style="width:100%;height:4px;background:var(--track-bg);border-radius:2px;margin-top:12px;position:relative;">
                  <div style="position:absolute;top:0;left:0;width:${pct}%;height:100%;background:var(--primary);border-radius:2px;"></div>
                </div>`;
              ]]]

      # RIGHT: Tall Thermostat Card
      - type: custom:button-card
        entity: climate.air_conditioner_office_climate
        show_name: false
        show_icon: false
        tap_action: { action: more-info }
        card_mod:
          style: |
            :host { flex: 1 !important; min-height: 0 !important; }
        styles:
          card:
          - background: var(--card-bg)
          - border: 1px solid var(--card-border)
          - border_radius: 16px
          - padding: 16px
          grid:
          - grid-template-areas: |
              "label"
              "dial_wrapper"
              "setpoint_row"
              "footer"
            grid-template-rows: min-content 1fr min-content min-content
          custom_fields:
            dial_wrapper:
            - position: relative
            - display: flex
            - align-items: center
            - justify_content: center
            btn_up:
            - position: absolute
            - right: '-20px'
            - top: 50%
            - transform: translateY(-50%)
            - z_index: '10'
            - width: 48px
            - height: 48px
            btn_down:
            - position: absolute
            - left: '-20px'
            - top: 50%
            - transform: translateY(-50%)
            - z_index: '10'
            - width: 48px
            - height: 48px
        custom_fields:
          label: |
            <span style="color:var(--text-muted);font-size:11px;font-weight:700;letter-spacing:0.15em;">THERMOSTAT</span>
          dial_wrapper: |
            [[[
              const s = states['climate.air_conditioner_office_climate'];
              const target = parseFloat(s?.attributes?.temperature) || 22;
              const st = s?.state || 'off';
              const cur = s?.attributes?.current_temperature ?? '--';
              let glow;
              if (st==='heat'||st==='heating') glow='#FF4D4D';
              else if (st==='cool'||st==='cooling'||st==='auto') glow='#64D3FF';
              else if (st==='dry'||st==='drying') glow='#8ADB52';
              else glow='rgba(161,161,166,0.3)';
              const frac = Math.max(0, Math.min(1, (target-15)/16));
              const circumference = 2 * Math.PI * 46;
              const off = circumference - frac * circumference;
              return `
                <div style="width:100%;aspect-ratio:1;max-width:240px;position:relative;display:flex;align-items:center;justify-content:center;">
                  <svg style="width:100%;height:100%;transform:rotate(-90deg);" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="46" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="5"/>
                    <circle cx="50" cy="50" r="46" fill="none" stroke="${glow}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${circumference}" stroke-dashoffset="${off}"/>
                  </svg>
                  <div style="position:absolute;text-align:center;pointer-events:none;">
                    <div style="display:flex;align-items:baseline;justify-content:center;gap:2px;">
                      <span style="color:var(--text-primary);font-size:56px;font-weight:300;line-height:1;">${cur}</span>
                      <span style="color:var(--text-muted);font-size:22px;font-weight:500;">°C</span>
                    </div>
                  </div>
                </div>`;
            ]]]
          btn_up:
            card:
              type: custom:button-card
              show_name: false
              show_icon: true
              icon: mdi:plus
              tap_action:
                action: call-service
                service: climate.set_temperature
                data:
                  entity_id: climate.air_conditioner_office_climate
                  temperature: >-
                    [[[ return Math.round(((parseFloat(states['climate.air_conditioner_office_climate']?.attributes?.temperature)||20)+1)*2)/2; ]]]
              styles:
                card:
                - background: rgba(255,255,255,0.06)
                - border-radius: 50%
                - display: flex
                - align_items: center
                - justify_content: center
                icon:
                - color: var(--text-primary)
                - width: 24px
          btn_down:
            card:
              type: custom:button-card
              show_name: false
              show_icon: true
              icon: mdi:minus
              tap_action:
                action: call-service
                service: climate.set_temperature
                data:
                  entity_id: climate.air_conditioner_office_climate
                  temperature: >-
                    [[[ return Math.round(((parseFloat(states['climate.air_conditioner_office_climate']?.attributes?.temperature)||20)-1)*2)/2; ]]]
              styles:
                card:
                - background: rgba(255,255,255,0.06)
                - border-radius: 50%
                - display: flex
                - align_items: center
                - justify_content: center
                icon:
                - color: var(--text-primary)
                - width: 24px
          setpoint_row: |
            [[[
              const s = states['climate.air_conditioner_office_climate'];
              const t = parseFloat(s?.attributes?.temperature) || 22;
              return `<div style="text-align:center;">
                <span style="color:var(--text-primary);font-size:28px;font-weight:500;">${t}</span><span style="color:var(--text-muted);font-size:16px;">°</span>
                <div style="color:var(--text-muted);font-size:10px;font-weight:700;letter-spacing:0.1em;margin-top:2px;">SET POINT</div>
              </div>`;
            ]]]
          footer: |
            [[[
              const hvac = states['climate.air_conditioner_office_climate'];
              const outside = states['sensor.air_conditioner_office_outside_air_temp'];
              const fan = (hvac?.attributes?.fan_mode||'AUTO').toUpperCase();
              const outT = parseFloat(outside?.state) || '--';
              return `<p style="color:var(--text-muted);font-size:12px;text-align:center;margin-top:6px;">FAN ${fan} • ${outT}°C OUTSIDE</p>`;
            ]]]

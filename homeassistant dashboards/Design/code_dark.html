<style>

<!-- Interactive Logic -->
<script>
        let setpoint = 20;
        const setpointDisplay = document.getElementById('setpoint-display');
        const activeRing = document.querySelector('.active-ring');

        function adjustTemp(delta) {
            setpoint += delta;
            if (setpoint < 15) setpoint = 15;
            if (setpoint > 30) setpoint = 30;
            setpointDisplay.innerText = setpoint + '°';
            
            // Visual feedback for ring (map 15-30 range to stroke dash)
            const percentage = (setpoint - 15) / (30 - 15);
            const offset = 283 - (percentage * 283);
            activeRing.style.strokeDashoffset = offset;
        }

        // Initialize ring
        adjustTemp(0);

        // Simple scale effect for all glass-cards on touch
        document.querySelectorAll('.glass-card').forEach(card => {
            card.addEventListener('mousedown', () => card.style.transform = 'scale(0.98)');
            card.addEventListener('mouseup', () => card.style.transform = 'scale(1)');
            card.addEventListener('mouseleave', () => card.style.transform = 'scale(1)');
        });
    </script>

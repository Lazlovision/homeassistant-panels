theme: kiosk_panel
kiosk_mode:
  kiosk: true
  admin_settings:
    kiosk: false
path: office-panel
title: Office Panel
views:
- title: Office
  path: office-panel
  badges: []
  cards:
  # === ROOT CONTAINER ===
  - type: vertical-stack
    card_mod:
      style: |
        ha-card {
          background: #000 !important;
          border: none !important;
          box-shadow: none !important;
          padding: 0 !important;
          margin: 0 !important;
          height: 100vh !important;
        }
        #root {
          display: flex !important;
          flex-direction: column !important;
          height: 100% !important;
          padding: 12px 20px 10px 20px !important;
          gap: 10px !important;
        }
        ha-panel-lovelace$ha-lovelace$ha-lovelace-main$ha-drawer$: |
          aside { display: none !important; }
          div { flex: 1 1 auto !important; width: 100% !important; }
        ha-panel-lovelace ha-lovelace ha-lovelace-main {
          margin-left: 0 !important;
        }
    cards:
    # --- TOP BAR ---
    - type: custom:button-card
      entity: weather.forecast_home
      show_name: false
      show_icon: false
      show_state: false
      custom_fields:
        content: |
          [[[
            var w = states['weather.forecast_home'];
            var out = states['sensor.air_conditioner_office_outside_air_temp'];
            var icon = {clear_night:'☀️',sunny:'☀️',cloudy:'⛅',partlycloudy:'⛅',rainy:'🌧️',snowy:'❄️',windy:'🎐'}[w?.state] || '⛅';
            var outT = out ? parseFloat(out.state) + '°C' : '--°C';
            return '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 12px;">' +
              '<span style="color:#FFFFFF;font-size:22px;font-weight:600;">Office</span>' +
              '<div style="display:flex;align-items:center;gap:10px;color:#8A8A93;font-size:14px;background:rgba(25,25,30,0.6);padding:8px 14px;border-radius:20px;">' +
              '<span>' + icon + '</span><span style="font-weight:500;color:#FFFFFF;">' + outT + ' Outside</span></div></div>';
          ]]]
      styles:
        card:
        - background: transparent
        - box-shadow: none
        - border: none
    # --- SCENES ---
    - type: horizontal-stack
      card_mod:
        style: |
          :host { --scene-size: 72px; }
          ha-card { background: transparent !important; border: none !important; box-shadow: none !important; }
      cards:
      - type: custom:button-card
        entity: scene.office_arrive
        name: Arrive
        icon: mdi:door
        tap_action:
          action: call-service
          service: scene.turn_on
          service_data: { entity_id: scene.office_arrive }
        styles:
          card:
          - background: rgba(0,176,223,0.15)
          - border-radius: 18px
          - width: var(--scene-size)
          - height: var(--scene-size)
          - display: grid
          - place-items: center
          icon:
          - color: '#00B0DF'
          - width: 28px
          - height: 28px
          name:
          - color: '#E4E1E6'
          - font-size: 11px
          - font-weight: 600
          - margin-top: 4px
      - type: custom:button-card
        entity: scene.office_movie
        name: Movie
        icon: mdi:film
        tap_action:
          action: call-service
          service: scene.turn_on
          service_data: { entity_id: scene.office_movie }
        styles:
          card:
          - background: rgba(255,145,0,0.15)
          - border-radius: 18px
          - width: var(--scene-size)
          - height: var(--scene-size)
          - display: grid
          - place-items: center
          icon:
          - color: '#FF9100'
          - width: 28px
          - height: 28px
          name:
          - color: '#E4E1E6'
          - font-size: 11px
          - font-weight: 600
          - margin-top: 4px
      - type: custom:button-card
        entity: scene.office_leave
        name: Leave
        icon: mdi:exit-run
        tap_action:
          action: call-service
          service: scene.turn_on
          service_data: { entity_id: scene.office_leave }
        styles:
          card:
          - background: rgba(255,82,82,0.15)
          - border-radius: 18px
          - width: var(--scene-size)
          - height: var(--scene-size)
          - display: grid
          - place-items: center
          icon:
          - color: '#FF5252'
          - width: 28px
          - height: 28px
          name:
          - color: '#E4E1E6'
          - font-size: 11px
          - font-weight: 600
          - margin-top: 4px
      - type: custom:button-card
        entity: scene.office_sleep
        name: Sleep
        icon: mdi:moon-waning-crescent
        tap_action:
          action: call-service
          service: scene.turn_on
          service_data: { entity_id: scene.office_sleep }
        styles:
          card:
          - background: rgba(138,217,82,0.15)
          - border-radius: 18px
          - width: var(--scene-size)
          - height: var(--scene-size)
          - display: grid
          - place-items: center
          icon:
          - color: '#8ADB52'
          - width: 28px
          - height: 28px
          name:
          - color: '#E4E1E6'
          - font-size: 11px
          - font-weight: 600
          - margin-top: 4px
    # --- MAIN CONTENT ---
    - type: horizontal-stack
      card_mod:
        style: |
          ha-card { background: transparent !important; border: none !important; box-shadow: none !important; }
      cards:
      # LEFT - Lights 2x2 Grid
      - type: grid
        square: false
        columns: 2
        card_mod:
          style: |
            ha-card { background: transparent !important; border: none !important; box-shadow: none !important; }
        cards:
        # Light 1 - Main Lights
        - type: custom:button-card
          entity: light.office_main_lights
          name: Main Light
          show_icon: false
          show_state: false
          custom_fields:
            icon_status: |
              [[[
                var s = states[entity_id];
                var on = s?.state === 'on';
                var br = s?.attributes?.brightness || 0;
                var pct = Math.round(br / 255 * 100);
                return '<div style="display:flex;justify-content:space-between;align-items:center;">' +
                  '<ha-icon icon="' + (on ? 'mdi:lightbulb' : 'mdi:lightbulb-off-outline') + '" style="width:24px;height:24px;--mdc-icon-size:24px;color:' + (on ? '#00B0DF' : '#8A8A93') + ';"></ha-icon>' +
                  '<div style="font-size:11px;color:' + (on ? '#E4E1E6' : '#8A8A93') + ';">' + (on ? pct + '%' : 'OFF') + '</div></div>';
              ]]]
            toggle: |
              [[[
                var s = states[entity_id];
                var on = s?.state === 'on';
                return '<div style="width:40px;height:22px;border-radius:11px;background:' + (on ? 'rgba(0,176,223,0.4)' : 'rgba(255,255,255,0.1)') + ';position:relative;"></div>';
              ]]]
            slider: |
              [[[
                var s = states[entity_id];
                var on = s?.state === 'on';
                var br = s?.attributes?.brightness || 0;
                var pct = Math.round(br / 255 * 100);
                return '<input type="range" min="0" max="100" value="' + pct + '" style="width:100%;height:4px;-webkit-appearance:none;appearance:none;background:' + (on ? 'linear-gradient(to right, #00B0DF ' + pct + '%, rgba(255,255,255,0.1) ' + pct + '%)' : 'rgba(255,255,255,0.1)') + ';border-radius:2px;outline:none;cursor:pointer;">';
              ]]]
          styles:
            card:
            - background: 'rgba(255,255,255,0.05) !important'
            - border-radius: '16px !important'
            - padding: '14px !important'
            - display: flex
            - flex-direction: column
            - justify-content: space-between
            - gap: 8px
            custom_fields:
              icon_status: []
              slider:
              - margin-top: 'auto'
        # Light 2 - Nanol
        - type: custom:button-card
          entity: light.office_nanol
          name: Nanol
          show_icon: false
          show_state: false
          custom_fields:
            icon_status: |
              [[[
                var s = states[entity_id];
                var on = s?.state === 'on';
                var br = s?.attributes?.brightness || 0;
                var pct = Math.round(br / 255 * 100);
                return '<div style="display:flex;justify-content:space-between;align-items:center;">' +
                  '<ha-icon icon="' + (on ? 'mdi:led-strip-variant' : 'mdi:led-strip-variant-off') + '" style="width:24px;height:24px;--mdc-icon-size:24px;color:' + (on ? '#00B0DF' : '#8A8A93') + ';"></ha-icon>' +
                  '<div style="font-size:11px;color:' + (on ? '#E4E1E6' : '#8A8A93') + ';">' + (on ? pct + '%' : 'OFF') + '</div></div>';
              ]]]
            toggle: |
              [[[
                var s = states[entity_id];
                var on = s?.state === 'on';
                return '<div style="width:40px;height:22px;border-radius:11px;background:' + (on ? 'rgba(0,176,223,0.4)' : 'rgba(255,255,255,0.1)') + ';position:relative;"></div>';
              ]]]
            slider: |
              [[[
                var s = states[entity_id];
                var on = s?.state === 'on';
                var br = s?.attributes?.brightness || 0;
                var pct = Math.round(br / 255 * 100);
                return '<input type="range" min="0" max="100" value="' + pct + '" style="width:100%;height:4px;-webkit-appearance:none;appearance:none;background:' + (on ? 'linear-gradient(to right, #00B0DF ' + pct + '%, rgba(255,255,255,0.1) ' + pct + '%)' : 'rgba(255,255,255,0.1)') + ';border-radius:2px;outline:none;cursor:pointer;">';
              ]]]
          styles:
            card:
            - background: 'rgba(255,255,255,0.05) !important'
            - border-radius: '16px !important'
            - padding: '14px !important'
            - display: flex
            - flex-direction: column
            - justify-content: space-between
            - gap: 8px
            custom_fields:
              icon_status: []
              slider:
              - margin-top: 'auto'
        # Light 3 - Placeholder (Chandelier)
        - type: custom:button-card
          name: Chandelier
          show_icon: false
          show_state: false
          custom_fields:
            icon_status: |
              <div style="display:flex;justify-content:space-between;align-items:center;">
                <ha-icon icon="mdi:lightbulb-multiple-off-outline" style="width:24px;height:24px;--mdc-icon-size:24px;color:#8A8A93;"></ha-icon>
                <div style="font-size:11px;color:#8A8A93;">OFF</div>
              </div>
            slider: |
              <input type="range" min="0" max="100" value="0" style="width:100%;height:4px;-webkit-appearance:none;appearance:none;background:rgba(255,255,255,0.1);border-radius:2px;outline:none;cursor:pointer;">
          styles:
            card:
            - background: 'rgba(255,255,255,0.05) !important'
            - border-radius: '16px !important'
            - padding: '14px !important'
            - display: flex
            - flex-direction: column
            - justify-content: space-between
            - gap: 8px
            custom_fields:
              icon_status: []
              slider:
              - margin-top: 'auto'
        # Light 4 - Placeholder (Accent Wall)
        - type: custom:button-card
          name: Accent Wall
          show_icon: false
          show_state: false
          custom_fields:
            icon_status: |
              <div style="display:flex;justify-content:space-between;align-items:center;">
                <ha-icon icon="mdi:lightbulb-multiple-off-outline" style="width:24px;height:24px;--mdc-icon-size:24px;color:#8A8A93;"></ha-icon>
                <div style="font-size:11px;color:#8A8A93;">OFF</div>
              </div>
            slider: |
              <input type="range" min="0" max="100" value="0" style="width:100%;height:4px;-webkit-appearance:none;appearance:none;background:rgba(255,255,255,0.1);border-radius:2px;outline:none;cursor:pointer;">
          styles:
            card:
            - background: 'rgba(255,255,255,0.05) !important'
            - border-radius: '16px !important'
            - padding: '14px !important'
            - display: flex
            - flex-direction: column
            - justify-content: space-between
            - gap: 8px
            custom_fields:
              icon_status: []
              slider:
              - margin-top: 'auto'
      # RIGHT - Thermostat
      - type: custom:button-card
        entity: climate.air_conditioner_office_climate
        show_name: false
        show_icon: false
        show_state: false
        custom_fields:
          label: |
            <span style="font-size:10px;font-weight:700;color:#8A8A93;letter-spacing:0.15em;">THERMOSTAT</span>
          dial_wrapper: |
            [[[
              var s = states[entity_id];
              var target = parseFloat(s?.attributes?.temperature) || 22;
              var st = s?.state || 'off';
              var cur = s?.attributes?.current_temperature ?? '--';
              var glow;
              if (st==='heat'||st==='heating') glow='#FF4D4D';
              else if (st==='cool'||st==='cooling'||st==='auto') glow='#64D3FF';
              else if (st==='dry'||st==='drying') glow='#8ADB52';
              else glow='rgba(161,161,166,0.3)';
              var frac = Math.max(0, Math.min(1, (target-15)/16));
              var circumference = Math.PI * 2 * 45;
              var offset = circumference * (1 - frac);
              return '<svg viewBox="0 0 120 120" style="width:160px;height:160px;">' +
                '<defs><linearGradient id="dialGrad" x1="0%" y1="0%" x2="100%" y2="0%">' +
                '<stop offset="0%" style="stop-color:#FF4D4D"/>' +
                '<stop offset="100%" style="stop-color:#64D3FF"/>' +
                '</linearGradient></defs>' +
                '<circle cx="60" cy="60" r="45" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="6"/>' +
                '<circle cx="60" cy="60" r="45" fill="none" stroke="url(#dialGrad)" stroke-width="6"' +
                ' stroke-dasharray="' + circumference + '" stroke-dashoffset="' + offset + '"' +
                ' stroke-linecap="round" transform="rotate(-90 60 60)" style="transition:stroke-dashoffset 0.5s;"/>' +
                '<text x="60" y="52" text-anchor="middle" fill="#E4E1E6" font-size="28" font-weight="700">' + cur + '°</text>' +
                '<text x="60" y="72" text-anchor="middle" fill="#8A8A93" font-size="11" font-weight="500">SET ' + target + '°</text>' +
                '</svg>';
            ]]]
          status_pill: |
            [[[
              var s = states[entity_id];
              var st = s?.state || 'off';
              if (st === 'off') return '';
              var color, icon, text;
              if (st==='heat'||st==='heating') { color='#FF4D4D'; icon='mdi:fire'; text='Heating Active'; }
              else if (st==='cool'||st==='cooling') { color='#64D3FF'; icon='mdi:snowflake'; text='Cooling Active'; }
              else if (st==='dry'||st==='drying') { color='#8ADB52'; icon='mdi:water'; text='Dry Active'; }
              else if (st==='fan_only') { color='#A1A1A6'; icon='mdi:fan'; text='Fan Only'; }
              else { color='#64D3FF'; icon='mdi:auto-mode'; text='Auto'; }
              return '<div style="display:inline-flex;align-items:center;gap:4px;background:' + color + '22;padding:4px 10px;border-radius:12px;">' +
                '<ha-icon icon="' + icon + '" style="width:12px;height:12px;--mdc-icon-size:12px;color:' + color + ';"></ha-icon>' +
                '<span style="font-size:10px;font-weight:600;color:' + color + ';">' + text + '</span></div>';
            ]]]
          setpoint: |
            [[[
              var s = states[entity_id];
              var target = parseFloat(s?.attributes?.temperature) || 22;
              return '<div style="display:flex;align-items:center;gap:12px;">' +
                '<ha-icon icon="mdi:minus" style="width:32px;height:32px;--mdc-icon-size:24px;color:#E4E1E6;background:rgba(255,255,255,0.08);border-radius:50%;cursor:pointer;"></ha-icon>' +
                '<span style="font-size:28px;font-weight:700;color:#E4E1E6;">' + target + '°</span>' +
                '<ha-icon icon="mdi:plus" style="width:32px;height:32px;--mdc-icon-size:24px;color:#E4E1E6;background:rgba(255,255,255,0.08);border-radius:50%;cursor:pointer;"></ha-icon></div>';
            ]]]
          info_row: |
            [[[
              var s = states[entity_id];
              var fan = s?.attributes?.fan_mode || 'auto';
              var out = states['sensor.air_conditioner_office_outside_air_temp'];
              var outT = out?.state || '--';
              return '<div style="display:flex;gap:16px;font-size:11px;color:#8A8A93;">' +
                '<div style="display:flex;align-items:center;gap:6px;"><ha-icon icon="mdi:fan" style="width:14px;height:14px;--mdc-icon-size:14px;"></ha-icon><span>' + fan + '</span></div>' +
                '<div style="display:flex;align-items:center;gap:6px;"><ha-icon icon="mdi:thermometer-outline" style="width:14px;height:14px;--mdc-icon-size:14px;"></ha-icon><span>' + outT + '° OUTSIDE</span></div></div>';
            ]]]
        styles:
          card:
          - display: flex
          - flex-direction: column
          - align-items: center
          - justify-content: center
          - gap: 12px
          - background: 'rgba(255,255,255,0.04) !important'
          - border-radius: '20px !important'
          - padding: '20px !important'
          - height: '100% !important'
          custom_fields:
            label:
            - align_self: flex-start
            dial_wrapper:
            - margin: '0 auto'
            status_pill:
            - align_self: center
            info_row:
            - align_self: center
    # --- MUSIC BAR ---
    - type: custom:button-card
      entity: media_player.office
      show_name: false
      show_icon: false
      show_state: false
      custom_fields:
        album_art: |
          [[[
            var s = states[entity_id];
            var art = s?.attributes?.entity_picture;
            if (art) return '<img src="' + art + '" style="width:44px;height:44px;border-radius:8px;object-fit:cover;">';
            return '<div style="width:44px;height:44px;border-radius:8px;background:rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;">' +
              '<ha-icon icon="mdi:music-note" style="width:20px;height:20px;--mdc-icon-size:20px;color:#8A8A93;"></ha-icon></div>';
          ]]]
        song_info: |
          [[[
            var s = states[entity_id];
            var title = s?.attributes?.media_title || 'No Media';
            var artist = s?.attributes?.media_artist || '';
            return '<div style="overflow:hidden;">' +
              '<div style="font-size:13px;font-weight:600;color:#E4E1E6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + title + '</div>' +
              '<div style="font-size:11px;color:#8A8A93;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + artist + '</div></div>';
          ]]]
        controls: |
          [[[
            var s = states[entity_id];
            var playing = s?.state === 'playing';
            return '<div style="display:flex;align-items:center;gap:12px;">' +
              '<ha-icon icon="mdi:skip-previous" style="width:20px;height:20px;--mdc-icon-size:20px;color:#8A8A93;cursor:pointer;"></ha-icon>' +
              '<ha-icon icon="' + (playing ? 'mdi:pause' : 'mdi:play') + '" style="width:28px;height:28px;--mdc-icon-size:28px;color:#E4E1E6;background:rgba(255,255,255,0.1);border-radius:50%;cursor:pointer;"></ha-icon>' +
              '<ha-icon icon="mdi:skip-next" style="width:20px;height:20px;--mdc-icon-size:20px;color:#8A8A93;cursor:pointer;"></ha-icon></div>';
          ]]]
        volume: |
          [[[
            var s = states[entity_id];
            var vol = Math.round((s?.attributes?.volume_level || 0.5) * 100);
            return '<div style="display:flex;align-items:center;gap:6px;">' +
              '<ha-icon icon="mdi:volume-high" style="width:16px;height:16px;--mdc-icon-size:16px;color:#8A8A93;"></ha-icon>' +
              '<input type="range" min="0" max="100" value="' + vol + '" style="width:80px;height:3px;-webkit-appearance:none;appearance:none;background:linear-gradient(to right, #64D3FF ' + vol + '%, rgba(255,255,255,0.1) ' + vol + '%);border-radius:2px;outline:none;cursor:pointer;"></div>';
          ]]]
      styles:
        card:
        - display: flex
        - align-items: center
        - gap: 14px
        - padding: '12px 16px !important'
        - background: 'rgba(255,255,255,0.06) !important'
        - border-radius: '16px !important'
        custom_fields:
          album_art:
          - flex: '0 0 44px'
          song_info:
          - flex: 1
          - min_width: 0
          controls:
          - flex: '0 0 auto'
          volume:
          - flex: '0 0 110px'
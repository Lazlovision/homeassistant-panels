                     '<div style="height:62px; min-height:62px; max-height:62px; overflow:hidden; margin-top:4px; text-align:center; width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; flex-shrink:0;">' +
                     '<div style="height:44px; min-height:44px; max-height:44px; line-height:44px; font-size:' + setpointFontSize + '; font-weight:800; color:' + mainTempColor + '; font-variant-numeric:tabular-nums; text-align:center; width:100%; display:flex; align-items:center; justify-content:center; overflow:hidden;">' + setpointMainTxt + '</div>' +
                     '<div style="height:16px; min-height:16px; max-height:16px; line-height:16px; font-size:14px; font-weight:800; color:#9E9EA8; letter-spacing:0.12em; text-align:center; width:100%; display:flex; align-items:center; justify-content:center; overflow:hidden;">' + setpointLabelTxt + '</div></div></div>' +
                     '<button class="res-btn" ontouchstart="window._btnPress(this)" ontouchend="window._btnRelease(this);event.stopPropagation(); ' + callPlus + '" onmousedown="window._btnPress(this)" onmouseup="window._btnRelease(this);event.stopPropagation(); ' + callPlus + '"' +
                     ' style="width:72px; height:245px; border-radius:24px; background:' + pillBg + '; border:' + pillBorder + '; display:flex; align-items:center; justify-content:center; cursor:pointer; touch-action:manipulation; outline:none; opacity:' + (isDisabled ? '0.3' : '1.0') + '; pointer-events:' + (isDisabled ? 'none' : 'auto') + '; flex-shrink:0;">' +
                     '<ha-icon icon="mdi:plus" style="width:44px; height:44px; --mdc-icon-size:44px; color:' + mainTempColor + '; pointer-events:none;"></ha-icon></button></div>' +
                     '<div style="display:flex; flex-direction:column; gap:14px; width:100%; flex-shrink:0; margin-top:6px;">' +
                     '<div style="font-size:14px; font-weight:800; color:' + titleColor + '; letter-spacing:0.12em; text-align:left; text-transform:uppercase;">SYSTEM MODE</div>' +
                     '<div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:12px; width:100%;">' + modesRow1Html + '</div>' +
                     '<div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:12px; width:100%;">' + modesRow2Html + '</div></div>' +
                     '<div style="display:flex; flex-direction:column; gap:10px; width:100%; flex-shrink:0;">' +
                     '<div style="font-size:14px; font-weight:800; color:' + titleColor + '; letter-spacing:0.12em; text-align:left; text-transform:uppercase;">FAN SPEED</div>' +
                     '<div style="display:grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap:12px; width:100%;">' + fanRowHtml + '</div></div></div>';
            ]]]

    # ===== RESTORED FULLY FEATURED GORGEOUS MEDIA BAR =====
    - type: custom:button-card
      entity: media_player.the_moon
      show_name: false
      show_icon: false
      show_state: false
      triggers_update:
      - media_player.the_moon
      - media_player.living_room_speaker
      - sun.sun
      tap_action:
        action: none
      card_mod:
        style: |
          :host { flex: 0 0 80px !important; height: 80px !important; min-height: 80px !important; max-height: 80px !important; display: block !important; }
          ha-card { background: {{ 'rgba(26, 26, 36, 0.95)' if is_state('sun.sun', 'below_horizon') else '#FFFFFF' }} !important; border-radius: 20px !important; border: {{ '1px solid rgba(255, 255, 255, 0.06)' if is_state('sun.sun', 'below_horizon') else '1px solid rgba(0, 0, 0, 0.08)' }} !important; box-shadow: {{ 'none' if is_state('sun.sun', 'below_horizon') else '0 4px 14px rgba(0,0,0,0.05)' }} !important; padding: 0 !important; height: 80px !important; }
      styles:
        card:
        - background: '[[[ return (states["sun.sun"]&&states["sun.sun"].state) === "below_horizon" ? "rgba(26, 26, 36, 0.95)" : "#FFFFFF"; ]]]'
        - border-radius: 20px
        - border: '[[[ return (states["sun.sun"]&&states["sun.sun"].state) === "below_horizon" ? "1px solid rgba(255, 255, 255, 0.06)" : "1px solid rgba(0, 0, 0, 0.08)"; ]]]'
        - box-shadow: '[[[ return (states["sun.sun"]&&states["sun.sun"].state) === "below_horizon" ? "none" : "0 4px 14px rgba(0,0,0,0.05)"; ]]]'
        - padding: '0'
        - height: '80px'
        - transform: 'translateZ(0)'
        - pointer-events: 'none'
        grid:
        - grid-template-areas: '"music_player_row"'
        - grid-template-columns: 1fr
        - grid-template-rows: 1fr
        custom_fields:
          music_player_row:
          - width: 100%
          - height: 100%
          - pointer-events: 'auto'
      custom_fields:
        music_player_row: |
          [[[
            window._plexCache = window._plexCache || {};

            var isNight = states['sun.sun'] ? states['sun.sun'].state === 'below_horizon' : false;
            var titleColor = isNight ? '#FFFFFF' : '#1C1C1E';
            var artistColor = isNight ? '#A1A1A8' : '#55555A';
            var iconColor = isNight ? '#FFFFFF' : '#1C1C1E';
            var playBg = isNight ? '#FFFFFF' : '#1C1C1E';
            var playIcon = isNight ? '#0A0A0C' : '#FFFFFF';
            var sliderBg = isNight ? 'rgba(255,255,255,0.12)' : 'rgba(0,0,0,0.12)';

            var s = states['media_player.the_moon'] || states['media_player.living_room_speaker'] || states['media_player.television'];
            var entityId = s ? s.entity_id : 'media_player.the_moon';
            var st = s ? s.state : 'off';
            var isPlaying = st === 'playing';

            var rawTitle = (s&&s.attributes&&s.attributes.media_title);
            var appName = (s&&s.attributes&&s.attributes.app_name) || 'Plex';
            var friendlyName = (s&&s.attributes&&s.attributes.friendly_name) || 'The Moon';
            var contentType = (s&&s.attributes&&s.attributes.media_content_type);
            
            var rawContentId = (s&&s.attributes&&s.attributes.media_content_id) || '';
            var metaMatch = rawContentId.match(/\/metadata\/(\d+)/);
            var metaId = metaMatch ? metaMatch[1] : null;

            var mainTitle = (rawTitle && rawTitle.trim() !== '') ? rawTitle : '';
            var mainSubtitle = ((s&&s.attributes&&s.attributes.media_artist)) ? s.attributes.media_artist : '';

            if (!mainTitle && metaId) {
              if (window._plexCache[metaId]) {
                mainTitle = window._plexCache[metaId].title;
                mainSubtitle = window._plexCache[metaId].subtitle;
              } else {
                mainTitle = appName || 'Plex Media';
                mainSubtitle = contentType ? (appName + ' • ' + contentType.toUpperCase()) : 'Playing';
                
                (function(mId) {
                  var plexToken = 'zcCxbxiYD4tGkbm7easY';
                  var fetchUrl = 'http://10.10.10.100:32400/library/metadata/' + mId + '?X-Plex-Token=' + plexToken;
                  fetch(fetchUrl)
                    .then(function(res) { return res.text(); })
                    .then(function(xmlText) {
                      var parser = new DOMParser();
                      var xmlDoc = parser.parseFromString(xmlText, 'text/xml');
                      var video = xmlDoc.querySelector('Video');
                      if (video) {
                        var vType = video.getAttribute('type');
                        var t = '', sub = '';
                        if (vType === 'episode') {
                          var show = video.getAttribute('grandparentTitle') || '';
                          var sNum = video.getAttribute('parentIndex') || '';
                          var eNum = video.getAttribute('index') || '';
                          var eTitle = video.getAttribute('title') || '';
                          t = show;
                          sub = (sNum && eNum) ? ('S' + sNum + ':E' + eNum + (eTitle ? ' • ' + eTitle : '')) : eTitle;
                        } else {
                          t = video.getAttribute('title') || '';
                          var yr = video.getAttribute('year') || '';
                          sub = yr ? ('Plex • Movie (' + yr + ')') : 'Plex • Movie';
                        }
                        window._plexCache[mId] = { title: t, subtitle: sub };
                        
                        var elT = document.getElementById('restored_media_title');
                        var elS = document.getElementById('restored_media_sub');
                        if (elT && t) elT.innerText = t;
                        if (elS && sub) elS.innerText = sub;
                      }
                    })
                    .catch(function() {});
                })(metaId);
              }
            }

            if (!mainTitle) mainTitle = rawTitle || appName || friendlyName;
            if (!mainSubtitle) mainSubtitle = contentType ? (appName + ' • ' + contentType.toUpperCase()) : friendlyName;
            var rawArt = (s&&s.attributes&&s.attributes.entity_picture);
            var art = rawArt ? rawArt.replace('https://10.10.10.100:32400', 'http://10.10.10.100:32400') : null;


            var vol = ((s&&s.attributes&&s.attributes.volume_level) !== undefined) ? Math.round(s.attributes.volume_level * 100) : 50;
            var isMuted = (s&&s.attributes&&s.attributes.is_volume_muted) || false;

            var duration = (s&&s.attributes&&s.attributes.media_duration) ? parseFloat(s.attributes.media_duration) : 0;
            var position = (s&&s.attributes&&s.attributes.media_position) ? parseFloat(s.attributes.media_position) : 0;

            function fmtTime(sec) {
              if (!sec || isNaN(sec) || sec <= 0) return '0:00';
              var m = Math.floor(sec / 60);
              var r = Math.floor(sec % 60);
              return m + ':' + (r < 10 ? '0' : '') + r;
            }
            var posStr = fmtTime(position);
            var durStr = fmtTime(duration);
            var artHtml = '<ha-icon icon="mdi:television-play" style="width:28px; height:28px; --mdc-icon-size:28px; color:#00B0DF; display:flex; align-items:center; justify-content:center;"></ha-icon>';
            if (art) {
              artHtml = '<img src="' + art + '" onerror="this.style.display=\'none\'; this.parentElement.innerHTML=\'<ha-icon icon=\\\'mdi:television-play\\\' style=\\\'width:28px; height:28px; --mdc-icon-size:28px; color:#00B0DF;\\\'></ha-icon>\';" style="width:100%; height:100%; object-fit:cover;">';
            }

            return `
              <style>
                .res-vol-slider {
                  -webkit-appearance: none;
                  appearance: none;
                  width: 110px;
                  height: 8px;
                  background: ${sliderBg};
                  border-radius: 4px;
                  outline: none;
                  margin: 0;
                  cursor: pointer;
                  touch-action: manipulation;
                  pointer-events: auto !important;
                }
                .res-vol-slider::-webkit-slider-thumb {
                  -webkit-appearance: none;
                  appearance: none;
                  width: 20px;
                  height: 20px;
                  border-radius: 50%;
                  background: ${isNight ? '#FFFFFF' : '#1C1C1E'};
                  cursor: pointer;
                  box-shadow: 0 1px 4px rgba(0,0,0,0.35);
                }
                .res-seek-slider {
                  -webkit-appearance: none;
                  width: 100%;
                  height: 6px;
                  background: ${sliderBg};
                  border-radius: 3px;
                  outline: none;
                  margin: 0;
                  cursor: pointer;
                  touch-action: manipulation;
                  pointer-events: auto !important;
                }
                .res-seek-slider::-webkit-slider-thumb {
                  -webkit-appearance: none;
                  appearance: none;
                  width: 16px;
                  height: 16px;
                  border-radius: 50%;
                  background: #00B0DF;
                  cursor: pointer;
                  box-shadow: 0 1px 4px rgba(0,0,0,0.35);
                }
              </style>
              <div style="display:flex; align-items:center; justify-content:space-between; width:100%; height:100%; padding:10px 24px; box-sizing:border-box; gap:16px; pointer-events:auto;">
                
                <div style="display:flex; align-items:center; gap:14px; flex:1.3; min-width:0; text-align:left;">
                  <div style="width:54px; height:54px; border-radius:12px; background:${isNight ? '#1A1A22' : '#E5E5EA'}; overflow:hidden; display:flex; align-items:center; justify-content:center; flex-shrink:0; border:1px solid ${isNight ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.1)'};">
                    ${artHtml}
                  </div>
                  <div style="overflow:hidden; min-width:0; text-align:left; display:flex; flex-direction:column; justify-content:center;">
                    <div id="restored_media_title" style="font-size:20px; font-weight:800; color:${titleColor}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:left; width:100%; letter-spacing:-0.01em; line-height:1.2;">${mainTitle}</div>
                    <div id="restored_media_sub" style="font-size:16px; font-weight:700; color:${artistColor}; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:left; width:100%; line-height:1.2;">${mainSubtitle}</div>
                  </div>
                </div>
                
                <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; flex:1.5;">
                  <div style="display:flex; align-items:center; gap:20px;">
                    <div style="cursor:pointer; touch-action:manipulation; display:flex; align-items:center; padding:10px; pointer-events:auto;"
                         ontouchstart="window._mpPress(this)" ontouchend="window._mpRelease(this);event.stopPropagation(); if(window._mpDB) return; window._mpDB=true; setTimeout(function(){window._mpDB=false;},200); if(!window._hass){window._hass=window.hass||(document.querySelector('home-assistant')&&document.querySelector('home-assistant').hass);} if(window._hass){ window._hass.callService('media_player', 'media_previous_track', {entity_id: '${entityId}'}); }">
                      <ha-icon icon="mdi:skip-previous" style="width:28px; height:28px; --mdc-icon-size:28px; color:${iconColor}; display:flex; align-items:center; justify-content:center; pointer-events:none;"></ha-icon>
                    </div>
                    
                    <div style="width:48px; height:48px; border-radius:50%; background:${playBg}; display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 3px 10px rgba(0,0,0,0.25); touch-action:manipulation; pointer-events:auto;"
                         ontouchstart="window._mpPress(this)" ontouchend="window._mpRelease(this);event.stopPropagation(); if(window._ppDB) return; window._ppDB=true; setTimeout(function(){window._ppDB=false;},200); if(!window._hass){window._hass=window.hass||(document.querySelector('home-assistant')&&document.querySelector('home-assistant').hass);} if(window._hass){ window._hass.callService('media_player', 'media_play_pause', {entity_id: '${entityId}'}); }">
                      <ha-icon icon="${isPlaying ? 'mdi:pause' : 'mdi:play'}" style="width:26px; height:26px; --mdc-icon-size:26px; color:${playIcon}; display:flex; align-items:center; justify-content:center; pointer-events:none; "></ha-icon>
                    </div>
                    
                    <div style="cursor:pointer; touch-action:manipulation; display:flex; align-items:center; padding:10px; pointer-events:auto;"
                         ontouchstart="window._mpPress(this)" ontouchend="window._mpRelease(this);event.stopPropagation(); if(window._mnDB) return; window._mnDB=true; setTimeout(function(){window._mnDB=false;},200); if(!window._hass){window._hass=window.hass||(document.querySelector('home-assistant')&&document.querySelector('home-assistant').hass);} if(window._hass){ window._hass.callService('media_player', 'media_next_track', {entity_id: '${entityId}'}); }">
                      <ha-icon icon="mdi:skip-next" style="width:28px; height:28px; --mdc-icon-size:28px; color:${iconColor}; display:flex; align-items:center; justify-content:center; pointer-events:none;"></ha-icon>
                    </div>
                  </div>
                  
                  <div style="width:100%; max-width:340px; display:flex; align-items:center; gap:10px;">
                    <span style="font-size:14px; font-weight:800; color:${artistColor}; width:44px; text-align:right;">${posStr}</span>
                    <input type="range" min="0" max="${duration > 0 ? duration : 100}" value="${position}" class="res-seek-slider"
                           ontouchstart="event.stopPropagation();"
                           ontouchend="event.stopPropagation();"
                           oninput="event.stopPropagation();"
                           onchange="event.stopPropagation(); const v=parseFloat(this.value); const h=window.hass||(document.querySelector('home-assistant')&&document.querySelector('home-assistant').hass); if(h){ h.callService('media_player', 'media_seek', {entity_id: '${entityId}', position: v}); }">
                    <span style="font-size:14px; font-weight:800; color:${artistColor}; width:44px; text-align:left;">${durStr}</span>
                  </div>
                </div>
                
                <div style="display:flex; align-items:center; justify-content:flex-end; gap:12px; flex:1.1;">
                  <div style="cursor:pointer; touch-action:manipulation; display:flex; align-items:center; padding:12px; pointer-events:auto;"
                       ontouchstart="window._mpPress(this)" ontouchend="window._mpRelease(this);event.stopPropagation(); if(window._muteDB) return; window._muteDB=true; setTimeout(function(){window._muteDB=false;},200); if(!window._hass){window._hass=window.hass||(document.querySelector('home-assistant')&&document.querySelector('home-assistant').hass);} if(window._hass){ window._hass.callService('media_player', 'volume_mute', {entity_id: '${entityId}', is_volume_muted: ${!isMuted}}); }">
                    <ha-icon icon="${isMuted ? 'mdi:volume-off' : 'mdi:volume-high'}" style="width:24px; height:24px; --mdc-icon-size:24px; color:${isMuted ? '#FF3366' : iconColor}; display:flex; align-items:center; justify-content:center; pointer-events:none;"></ha-icon>
                  </div>
                  
                  <input type="range" min="0" max="100" value="${vol}" class="res-vol-slider"
                         ontouchstart="event.stopPropagation();"
                         ontouchend="event.stopPropagation();"
                         oninput="event.stopPropagation(); const rd=document.getElementById('restored_media_vol_txt'); if(rd){ rd.innerText=this.value+'%'; }"
                         onchange="event.stopPropagation(); const v=parseInt(this.value)/100; const h=window.hass||(document.querySelector('home-assistant')&&document.querySelector('home-assistant').hass); if(h){ h.callService('media_player', 'volume_set', {entity_id: '${entityId}', volume_level: v}); }">
                  
                  <span id="restored_media_vol_txt" style="font-size:16px; font-weight:800; color:${titleColor}; width:48px; text-align:right;">${isMuted ? 'MUTED' : vol + '%'}</span>
                </div>
              </div>
            `;
          ]]]

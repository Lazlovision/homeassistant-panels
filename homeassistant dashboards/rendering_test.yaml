theme: default
kiosk_mode:
  kiosk: true
  hide_header: true
  hide_sidebar: true
path: office-panel
title: Office Panel
views:
  - title: Office
    path: office-panel
    type: panel
    badges: []
    cards:
      - type: vertical-stack
        card_mod:
          style: |
            :host {
              position: fixed !important;
              top: 0 !important;
              left: 0 !important;
              width: 100vw !important;
              height: 100vh !important;
              z-index: 1 !important;
              background: #09090C !important;
              overflow: hidden !important;
              transform: translateZ(0) !important;
            }
            ha-card {
              background: #09090C !important;
              border: none !important;
              box-shadow: none !important;
              padding: 0 !important;
              margin: 0 !important;
            }
            #root {
              display: grid !important;
              grid-template-columns: 1fr 1fr 1fr !important;
              grid-template-rows: 1fr 1fr !important;
              gap: 12px !important;
              padding: 12px !important;
              height: 100% !important;
            }
        cards:
          # Test 1: Flex Gap
          - type: custom:button-card
            template:
            custom_fields:
              content: |
                <div style="display:flex;flex-direction:column;height:100%;justify-content:space-between;">
                  <div>
                    <div style="font-size:11px;font-weight:800;color:#8A8A93;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:8px;">A. FLEX GAP</div>
                    <div style="display:flex;flex-direction:column;gap:8px;">
                      <div style="height:18px;width:100%;background:#00E5FF;"></div>
                      <div style="height:18px;width:100%;background:#00E5FF;"></div>
                      <div style="height:18px;width:100%;background:#00E5FF;"></div>
                      <div style="height:18px;width:100%;background:#00E5FF;"></div>
                    </div>
                  </div>
                  <div style="font-size:10px;font-weight:700;color:#8A8A93;">4×18px + 3×8px gap = 96px</div>
                </div>
            styles:
              card:
                - background: '#161622'
                - border-radius: '12px'
                - padding: '12px'
                - height: '100%'
                - display: 'flex'
              custom_fields:
                content:
                  - grid-area: 'content'
            layout:
              grid:
                - grid-template-areas: '"content"'
                - grid-template-columns: '1fr'

          # Test 2: Font Width Pills
          - type: custom:button-card
            template:
            custom_fields:
              content: |
                <div style="display:flex;flex-direction:column;height:100%;justify-content:space-between;">
                  <div>
                    <div style="font-size:11px;font-weight:800;color:#8A8A93;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:8px;">B. FONT WIDTH</div>
                    <div style="margin-bottom:6px;">
                      <span style="font-size:15px;font-weight:800;color:#FFFFFF;background:#1A1A24;padding:4px 10px;border-radius:12px;display:inline-block;border:1px solid #333;">PM2.5 0 AUTO</span>
                    </div>
                    <div style="margin-bottom:6px;">
                      <span style="font-size:32px;font-weight:700;color:#FFFFFF;background:#1A1A24;padding:6px 12px;border-radius:16px;display:inline-block;border:1px solid #333;">LIVING ROOM</span>
                    </div>
                    <div>
                      <span style="font-size:60px;font-weight:700;color:#FFFFFF;background:#1A1A24;padding:6px 12px;border-radius:16px;display:inline-block;border:1px solid #333;">22.5&deg;</span>
                    </div>
                  </div>
                  <div style="font-size:10px;font-weight:700;color:#8A8A93;">Pill borders show text width</div>
                </div>
            styles:
              card:
                - background: '#161622'
                - border-radius: '12px'
                - padding: '12px'
                - height: '100%'
                - display: 'flex'
              custom_fields:
                content:
                  - grid-area: 'content'
            layout:
              grid:
                - grid-template-areas: '"content"'
                - grid-template-columns: '1fr'

          # Test 3: Grid Layout
          - type: custom:button-card
            template:
            custom_fields:
              content: |
                <div style="display:flex;flex-direction:column;height:100%;justify-content:space-between;">
                  <div>
                    <div style="font-size:11px;font-weight:800;color:#8A8A93;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:8px;">C. CSS GRID</div>
                    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;">
                      <div style="font-size:13px;font-weight:800;color:#FFFFFF;background:#00E5FF;border-radius:8px;padding:8px 0;text-align:center;">COOL</div>
                      <div style="font-size:13px;font-weight:800;color:#FFFFFF;background:#FF3366;border-radius:8px;padding:8px 0;text-align:center;">HEAT</div>
                      <div style="font-size:13px;font-weight:800;color:#FFFFFF;background:#8A8A93;border-radius:8px;padding:8px 0;text-align:center;">AUTO</div>
                    </div>
                  </div>
                  <div style="font-size:10px;font-weight:700;color:#8A8A93;">3 cols × 1fr, gap 6px</div>
                </div>
            styles:
              card:
                - background: '#161622'
                - border-radius: '12px'
                - padding: '12px'
                - height: '100%'
                - display: 'flex'
              custom_fields:
                content:
                  - grid-area: 'content'
            layout:
              grid:
                - grid-template-areas: '"content"'
                - grid-template-columns: '1fr'

          # Test 4: Bottom Anchoring
          - type: custom:button-card
            template:
            custom_fields:
              content: |
                <div style="display:flex;flex-direction:column;height:100%;">
                  <div style="font-size:11px;font-weight:800;color:#8A8A93;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:8px;">D. BOTTOM ANCHOR</div>
                  <div style="display:flex;flex-direction:column;flex:1;justify-content:space-between;background:#1A1A24;border-radius:8px;padding:8px;">
                    <div style="font-size:13px;font-weight:800;color:#FFFFFF;">TOP</div>
                    <div style="margin-top:auto;font-size:13px;font-weight:800;color:#FFFFFF;background:#FF3366;padding:8px;border-radius:8px;text-align:center;">BOTTOM</div>
                  </div>
                </div>
            styles:
              card:
                - background: '#161622'
                - border-radius: '12px'
                - padding: '12px'
                - height: '100%'
                - display: 'flex'
              custom_fields:
                content:
                  - grid-area: 'content'
            layout:
              grid:
                - grid-template-areas: '"content"'
                - grid-template-columns: '1fr'

          # Test 5: Border Radius
          - type: custom:button-card
            template:
            custom_fields:
              content: |
                <div style="display:flex;flex-direction:column;height:100%;justify-content:space-between;">
                  <div>
                    <div style="font-size:11px;font-weight:800;color:#8A8A93;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:8px;">E. BORDER RADIUS</div>
                    <div style="display:flex;flex-direction:column;gap:6px;">
                      <div style="display:flex;align-items:center;gap:6px;">
                        <div style="width:40px;height:40px;background:#00E5FF;border-radius:6px;"></div>
                        <span style="font-size:10px;font-weight:700;color:#8A8A93;">6px</span>
                      </div>
                      <div style="display:flex;align-items:center;gap:6px;">
                        <div style="width:40px;height:40px;background:#00E5FF;border-radius:12px;"></div>
                        <span style="font-size:10px;font-weight:700;color:#8A8A93;">12px</span>
                      </div>
                      <div style="display:flex;align-items:center;gap:6px;">
                        <div style="width:40px;height:40px;background:#00E5FF;border-radius:20px;"></div>
                        <span style="font-size:10px;font-weight:700;color:#8A8A93;">circle</span>
                      </div>
                      <div style="display:flex;align-items:center;gap:6px;">
                        <div style="width:80px;height:32px;background:#FF3366;border-radius:16px;display:flex;justify-content:center;align-items:center;"><span style="font-size:11px;font-weight:800;color:#FFFFFF;">PILL</span></div>
                        <span style="font-size:10px;font-weight:700;color:#8A8A93;">pill</span>
                      </div>
                    </div>
                  </div>
                </div>
            styles:
              card:
                - background: '#161622'
                - border-radius: '12px'
                - padding: '12px'
                - height: '100%'
                - display: 'flex'
              custom_fields:
                content:
                  - grid-area: 'content'
            layout:
              grid:
                - grid-template-areas: '"content"'
                - grid-template-columns: '1fr'

          # Test 6: Color Accuracy
          - type: custom:button-card
            template:
            custom_fields:
              content: |
                <div style="display:flex;flex-direction:column;height:100%;justify-content:space-between;">
                  <div>
                    <div style="font-size:11px;font-weight:800;color:#8A8A93;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:8px;">F. COLOR</div>
                    <div style="display:flex;flex-direction:column;gap:4px;">
                      <div style="display:flex;align-items:center;gap:6px;">
                        <div style="width:40px;height:24px;background:#00E5FF;border:1px solid #333;"></div>
                        <span style="font-size:9px;font-weight:700;color:#8A8A93;font-family:monospace;">#00E5FF</span>
                      </div>
                      <div style="display:flex;align-items:center;gap:6px;">
                        <div style="width:40px;height:24px;background:#FF3366;border:1px solid #333;"></div>
                        <span style="font-size:9px;font-weight:700;color:#8A8A93;font-family:monospace;">#FF3366</span>
                      </div>
                      <div style="display:flex;align-items:center;gap:6px;">
                        <div style="width:40px;height:24px;background:#8A8A93;border:1px solid #333;"></div>
                        <span style="font-size:9px;font-weight:700;color:#8A8A93;font-family:monospace;">#8A8A93</span>
                      </div>
                      <div style="display:flex;align-items:center;gap:6px;">
                        <div style="width:40px;height:24px;background:#1A1A24;border:1px solid #333;"></div>
                        <span style="font-size:9px;font-weight:700;color:#8A8A93;font-family:monospace;">#1A1A24</span>
                      </div>
                      <div style="display:flex;align-items:center;gap:6px;">
                        <div style="width:40px;height:24px;background:#09090C;border:1px solid #333;"></div>
                        <span style="font-size:9px;font-weight:700;color:#8A8A93;font-family:monospace;">#09090C</span>
                      </div>
                      <div style="display:flex;align-items:center;gap:6px;">
                        <div style="width:40px;height:24px;background:linear-gradient(90deg,#00E5FF,#FF3366);border:1px solid #333;"></div>
                        <span style="font-size:9px;font-weight:700;color:#8A8A93;">gradient</span>
                      </div>
                    </div>
                  </div>
                </div>
            styles:
              card:
                - background: '#161622'
                - border-radius: '12px'
                - padding: '12px'
                - height: '100%'
                - display: 'flex'
              custom_fields:
                content:
                  - grid-area: 'content'
            layout:
              grid:
                - grid-template-areas: '"content"'
                - grid-template-columns: '1fr'

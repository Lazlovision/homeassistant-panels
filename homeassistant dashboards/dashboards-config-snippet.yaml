# ============================================================================
# Crestron Home Assistant Dashboards — Configuration Snippet
# ============================================================================
# Paste this block into your configuration.yaml.
# If you already have a 'lovelace:' or 'dashboards:' block, merge these entries
# into the existing one instead of duplicating the key.
#
# After pasting: restart Home Assistant and verify no config errors appear in
# Settings → System → Logs.
# ============================================================================

# Add to configuration.yaml
# The path is relative to your HA config directory.
# Copy each .yaml file into <config>/dashboards/ before restarting.
lovelace:
  mode: yaml
  dashboards:
    dashboards/bedroom.yaml:
      title: Bedroom
      icon: mdi:bed-outline
      show_in_sidebar: true
      require_admin: false
    dashboards/office.yaml:
      title: Office
      icon: mdi:desk-lamp
      show_in_sidebar: true
      require_admin: false
    dashboards/livingroom.yaml:
      title: Living Room
      icon: mdi:sofa-outline
      show_in_sidebar: true
      require_admin: false

# Alternative: if you use storage mode (default), just drop the .yaml files
# into the 'dashboards/' folder inside your HA config directory.
# Home Assistant will auto-detect them in UI mode for YAML-based dashboards.
# In that case, register via UI: Settings → Dashboards → Add Dashboard →
# choose "YAML dashboard" and point to each file.
